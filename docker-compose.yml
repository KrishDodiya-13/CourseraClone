# Local development services. Supply your own credentials in .env.local —
# the values below are for a throwaway local container only and must never be
# reused for a hosted database.
services:
  postgres:
    image: postgres:16-alpine
    container_name: lumen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.local}
      POSTGRES_DB: ${POSTGRES_DB:-lumen}
    ports:
      # Host port is configurable: 5432 and 5433 are commonly already taken
      # by locally installed PostgreSQL servers.
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - lumen-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lumen}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lumen-pgdata:
